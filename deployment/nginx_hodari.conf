# =============================================================================
# Nginx Configuration for HODARI
# Domain: connect.hodari.ac.tz
# Ports: 80 (ACME+redirect), 8070 (HTTP app), 8443 (HTTPS app)
# =============================================================================
# NOTE: This is for the hodari site ONLY. Does not interfere with other projects
# on the same server (bernice.nguzo.co.tz, etc.) — each uses its own
# server_name and port binding.
#
# SSL: certbot certonly --webroot places certs at the Let's Encrypt path below.
#      After certbot runs, reload nginx to enable the 8443 SSL block.
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=hodari_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=hodari_login:10m rate=5r/m;

upstream hodari_app {
    server 127.0.0.1:8007 fail_timeout=0;
    keepalive 32;
}

# ──────────────────────────────────────────────
# Port 80 — ACME challenge + redirect to app
# ──────────────────────────────────────────────
server {
    listen 80;
    server_name connect.hodari.ac.tz;

    # Let's Encrypt ACME challenge (must be on port 80)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Everything else → redirect to the app
    location / {
        return 301 http://$server_name:8070$request_uri;
    }
}

# ──────────────────────────────────────────────
# Port 8070 — HTTP (main app, always works)
# ──────────────────────────────────────────────
server {
    listen 8070;
    server_name connect.hodari.ac.tz;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml image/svg+xml;

    client_max_body_size 25M;

    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /static/ {
        alias /opt/hodari/hisms_backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /opt/hodari/hisms_backend/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /favicon.ico {
        alias /opt/hodari/hisms_backend/staticfiles/branding/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location /robots.txt {
        return 200 "User-agent: *\nDisallow: /admin/\nDisallow: /api/\n";
        add_header Content-Type text/plain;
    }

    location /accounts/login/ {
        limit_req zone=hodari_login burst=3 nodelay;
        proxy_pass http://hodari_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        limit_req zone=hodari_general burst=10 nodelay;
        proxy_pass http://hodari_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://hodari_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        limit_req zone=hodari_general burst=20 nodelay;
        proxy_pass http://hodari_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~* \.(py|pyc|pyo|log)$ { deny all; }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /opt/hodari/hisms_backend/templates; }
}

# ──────────────────────────────────────────────
# Port 8443 — HTTPS (SSL, needs cert from certbot)
# ──────────────────────────────────────────────
server {
    listen 8443 ssl;
    server_name connect.hodari.ac.tz;

    ssl_certificate     /etc/letsencrypt/live/connect.hodari.ac.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connect.hodari.ac.tz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml image/svg+xml;

    client_max_body_size 25M;

    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /static/ {
        alias /opt/hodari/hisms_backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /opt/hodari/hisms_backend/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /favicon.ico {
        alias /opt/hodari/hisms_backend/staticfiles/branding/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location /robots.txt {
        return 200 "User-agent: *\nDisallow: /admin/\nDisallow: /api/\n";
        add_header Content-Type text/plain;
    }

    location /accounts/login/ {
        limit_req zone=hodari_login burst=3 nodelay;
        proxy_pass http://hodari_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin/ {
        limit_req zone=hodari_general burst=10 nodelay;
        proxy_pass http://hodari_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        proxy_pass http://hodari_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }

    location / {
        limit_req zone=hodari_general burst=20 nodelay;
        proxy_pass http://hodari_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~* \.(py|pyc|pyo|log)$ { deny all; }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /opt/hodari/hisms_backend/templates; }
}
