# =============================================================================
# Nginx config for the SECOND site: hodari.nguzo.co.tz
# Coexists with connect.hodari.ac.tz on the SAME box and the SAME port 443 —
# nginx routes by `server_name`, so both HTTPS sites share 443 cleanly.
# Proxies to the isolated gunicorn on 127.0.0.1:8009 (connect uses 8007).
# Install as /etc/nginx/sites-available/nguzo and symlink into sites-enabled.
# =============================================================================

limit_req_zone $binary_remote_addr zone=nguzo_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=nguzo_login:10m rate=5r/m;

upstream nguzo_app {
    server 127.0.0.1:8009 fail_timeout=0;
    keepalive 32;
}

# Port 80: ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name hodari.nguzo.co.tz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Port 443: HTTPS (this site's own cert)
server {
    listen 443 ssl;
    server_name hodari.nguzo.co.tz;

    ssl_certificate     /etc/letsencrypt/live/hodari.nguzo.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hodari.nguzo.co.tz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_nguzo:10m;
    ssl_session_timeout 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml;

    client_max_body_size 25M;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /static/ {
        alias /var/www/hodari/hisms_backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /media/ {
        alias /var/www/hodari/hisms_backend/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
    location /favicon.ico {
        alias /var/www/hodari/hisms_backend/staticfiles/branding/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location /accounts/login/ {
        limit_req zone=nguzo_login burst=3 nodelay;
        proxy_pass http://nguzo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req zone=nguzo_general burst=20 nodelay;
        proxy_pass http://nguzo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~* \.(py|pyc|pyo|log)$ { deny all; }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /var/www/hodari/hisms_backend/templates; }
}
