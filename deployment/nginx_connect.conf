# =============================================================================
# Nginx Configuration for HODARI (production)
# Domain: connect.hodari.ac.tz
# Installed at: /etc/nginx/sites-available/hodari (symlinked in sites-enabled)
# =============================================================================
#
# FIX (2026-11-16): staff were sent to a bare "404 Not Found / nginx" page.
# 1. The login rate limit (5/min per IP) counted every GET of the sign-in page.
#    The whole school reaches us from one IP, and an expired session made
#    pages like primary-assessment fire dozens of background requests that each
#    redirected to /accounts/login/, so the limit was used up in seconds.
#    Now only sign-in submissions (POST) are limited; Django already locks an
#    account after repeated wrong passwords.
# 2. A rate-limited request returned 503, error_page sent it to /50x.html, and
#    that file did not exist, so nginx showed 404 instead. Error pages now come
#    from deployment/errors/, and the limit answers 429.
# =============================================================================

# FIX: only POSTs get a key; requests with an empty key are never limited.
map $request_method $hodari_login_post_key {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $binary_remote_addr zone=hodari_general:10m rate=30r/s;
limit_req_zone $hodari_login_post_key zone=hodari_login_post:10m rate=10r/m;

upstream hodari_app {
    server 127.0.0.1:8007 fail_timeout=0;
    keepalive 32;
}

# Port 80: ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name connect.hodari.ac.tz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Port 443: HTTPS (main app)
server {
    listen 443 ssl;
    server_name connect.hodari.ac.tz;

    ssl_certificate     /etc/letsencrypt/live/connect.hodari.ac.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connect.hodari.ac.tz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml;

    client_max_body_size 25M;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;

    # FIX: "too many requests" instead of 503 (which looked like an outage).
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /static/ {
        alias /opt/hodari/hisms_backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /opt/hodari/hisms_backend/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /favicon.ico {
        alias /opt/hodari/hisms_backend/staticfiles/branding/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location /robots.txt {
        return 200 "User-agent: *\nDisallow: /admin/\nDisallow: /api/\n";
        add_header Content-Type text/plain;
    }

    location /accounts/login/ {
        limit_req zone=hodari_login_post burst=10 nodelay;   # FIX: POSTs only
        limit_req zone=hodari_general burst=20 nodelay;
        proxy_pass http://hodari_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin/ {
        limit_req zone=hodari_general burst=10 nodelay;
        proxy_pass http://hodari_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        proxy_pass http://hodari_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }

    location / {
        limit_req zone=hodari_general burst=20 nodelay;
        proxy_pass http://hodari_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~* \.(py|pyc|pyo|log)$ { deny all; }

    error_page 404 /404.html;
    # FIX: 429 gets a real page too, and the page now exists on disk.
    error_page 429 500 502 503 504 /50x.html;
    location = /50x.html {
        root /opt/hodari/hisms_backend/deployment/errors;
        internal;
    }
}
