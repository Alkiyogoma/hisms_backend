<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Please try again shortly</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fb; color: #1f2a44; display: grid; place-items: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
  main { max-width: 440px; background: #fff; border: 1px solid #e3e8f2; border-radius: 14px; padding: 28px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { margin: 0 0 18px; line-height: 1.5; color: #4a5672; }
  a { display: inline-block; background: #0b3aa4; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Please try again in a minute</h1>
  <p>The school system is busy or briefly unavailable. Wait a moment, then try again.</p>
  <a href="/">Back to sign in</a>
</main>
</body>
</html>
