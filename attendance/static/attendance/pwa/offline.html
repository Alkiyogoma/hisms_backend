<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#023AA5">
<title>Offline — Hodari Attendance</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#F8FAFC;color:#0F172A;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;
}
.card{
  background:#fff;border-radius:16px;
  box-shadow:0 4px 24px rgba(0,0,0,.08);
  max-width:360px;width:100%;padding:40px 28px;text-align:center;
  border:1px solid #E2E8F0;
}
.icon{
  width:72px;height:72px;border-radius:50%;
  background:#FEF3C7;margin:0 auto 20px;
  display:flex;align-items:center;justify-content:center;
}
h1{font-size:20px;font-weight:700;margin-bottom:8px}
p{font-size:14px;color:#64748B;line-height:1.5;margin-bottom:24px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 28px;border-radius:12px;
  background:#023AA5;color:#fff;
  font-size:15px;font-weight:600;font-family:'Inter';
  border:none;cursor:pointer;
  text-decoration:none;transition:background .15s;
}
.btn:active{background:#012880}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#92550A" stroke-width="2" stroke-linecap="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>No internet connection detected. Your attendance scans will be saved locally and submitted when you're back online.</p>
    <button class="btn" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Retry
    </button>
  </div>
</body>
</html>
