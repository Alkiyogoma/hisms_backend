
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if class_view %}Progress Reports - {{ class_name }}{% else %}Progress Report - {{ student.get_full_name }}{% endif %}</title>
    {% include "includes/hodari_print_styles.html" %}
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;700&family=Arial:wght@400;700&display=swap');

        body {
            font-family: 'Times New Roman', Times, serif;
            background: white;
            color: black;
            margin: 0;
            padding: 40px;
            font-size: 11pt;
        }
        .no-print {
            max-width: 800px;
            margin: 0 auto 20px;
            text-align: right;
            background: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid #ccc;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            font-family: Arial, sans-serif;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border: none;
        }
        .btn-primary { background: #023AA5; color: #fff; }
        .btn-outline { background: #fff; color: #023AA5; border: 1.5px solid #023AA5; }
        .btn-green { background: #1B7B34; color: #fff; }
        
        .report-wrapper { max-width: 800px; margin: 0 auto; }
        

        /* Report Title */
        .report-title {
            text-align: center;
            font-size: 12pt;
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        
        /* Student Info */
        .student-info-top {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 10pt;
            margin-bottom: 5px;
        }
        .student-info-middle {
            font-weight: bold;
            font-size: 10pt;
            margin-bottom: 10px;
        }
        .student-info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            font-size: 10pt;
            font-weight: bold;
        }
        .student-info-table td {
            border: 1px solid black;
            padding: 5px 10px;
            width: 50%;
        }
        
        /* Academic Progress Table */
        .section-title {
            font-weight: bold;
            text-decoration: underline;
            text-transform: uppercase;
            font-size: 10pt;
            margin-bottom: 5px;
        }
        
        .academic-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 9pt;
            font-family: Arial, sans-serif;
            margin-bottom: 0;
        }
        .academic-table th, .academic-table td {
            border: 1px solid black;
            padding: 6px;
            text-align: center;
        }
        .academic-table th {
            background-color: #023AA5;
            color: white;
            font-weight: bold;
        }
        .academic-table .subject-col {
            text-align: left;
            font-weight: normal;
        }
        .academic-table .exam-avg-row td {
            background-color: #d9d9d9;
            font-weight: bold;
        }
        .academic-table td.awaiting, .academic-table .exam-avg-row td.awaiting {
            background-color: #FFF4DA;
            color: #8A6400;
            font-weight: bold;
        }
        
        /* Remarks Table */
        .remarks-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 9pt;
            font-family: Arial, sans-serif;
            margin-bottom: 20px;
            margin-top: -1px; /* overlap border */
        }
        .remarks-table th, .remarks-table td {
            border: 1px solid black;
            padding: 6px;
        }
        .remarks-table th {
            background-color: #023AA5;
            color: white;
            font-weight: bold;
            text-align: center;
        }
        .remarks-table .subject-col {
            background-color: #fce49c;
            text-align: left;
            width: 85%; /* span equivalent to subject+quiz+mid+end+total+grade */
        }
        .remarks-table .remark-val-col {
            text-align: left;
            background-color: white;
        }
        
        /* Grading Scale */
        .grading-scale {
            width: 100%;
            border-collapse: collapse;
            font-size: 8pt;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-bottom: 20px;
        }
        .grading-scale th {
            background-color: #023AA5;
            color: white;
            font-weight: bold;
            padding: 6px;
            border: 1px solid black;
            text-transform: uppercase;
        }
        .grading-scale td {
            border: 1px solid black;
            padding: 5px;
        }
        .grading-scale .bold-row td { font-weight: bold; }
        
        /* Page Break */
        .page-break { page-break-before: always; }
        
        /* General Traits: two sections per row */
        .traits-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            align-items: start;
        }
        .traits-full { grid-column: 1 / -1; }
        .traits-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 9pt;
            font-family: Arial, sans-serif;
        }
        .traits-table th, .traits-table td {
            border: 1px solid black;
            padding: 4px;
        }
        .traits-table th {
            background-color: #023AA5;
            color: white;
            font-weight: bold;
            text-align: center;
        }
        .traits-table td { text-align: left; }
        .traits-table td.g { text-align: center; width: 25px; font-weight: bold; }

        /* Two sheets: separate pages on screen, a page break in print */
        .sheet { background: #fff; }
        .sheet-2 { page-break-before: always; break-before: page; }
        /* Title, learner details and signatures: same look as the Student Progress Report */
        .sheet .doc-title { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin: 4px 0 10px; }
        .sheet .doc-title h1 { font-family: 'Merriweather', Georgia, serif; font-size: 16pt; color: #023AA5; margin: 0; }
        .sheet .doc-title .scope { font: 700 8.5pt Arial, sans-serif; letter-spacing: 1px; text-transform: uppercase; color: #023AA5; background: #EAF1FD; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
        .sheet .meta { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid #DDE3EE; border-radius: 6px; margin-bottom: 12px; font-family: Arial, sans-serif; }
        .sheet .meta > div { padding: 6px 10px; border-right: 1px solid #DDE3EE; }
        .sheet .meta > div:last-child { border-right: none; }
        .sheet .meta span { display: block; font-size: 7pt; letter-spacing: .8px; text-transform: uppercase; color: #8492A6; font-weight: 700; }
        .sheet .meta b { font-size: 9.5pt; font-weight: 600; }
        .sheet .teacher-remark { border: 1px solid #DDE3EE; border-radius: 6px; padding: 8px 12px; min-height: 60px; font-size: 10pt; margin-bottom: 8px; }
        .sheet .teacher-remark-label { font: 700 8.5pt Arial, sans-serif; margin-bottom: 4px; }
        .sheet .signatures { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 28px; margin-top: 8px; padding-top: 4px; border-top: 1px solid #DDE3EE; font-family: Arial, sans-serif; break-inside: avoid; page-break-inside: avoid; }
        .sheet .sig-line { border-bottom: 1.5px solid #474747; height: 30px; }
        .sheet .sig-label { font-size: 9pt; font-weight: 700; color: #474747; margin-top: 6px; line-height: 1.3; }
        .sheet .sig-label span { font-weight: 400; }
        .sheet .sig-hos { position: relative; }
        .sheet .sig-hos .stamp-container { bottom: auto; top: -40px; right: 0; }

        /* A class print: each learner starts on a new page */
        .report-wrapper + .report-wrapper { page-break-before: always; break-before: page; }
        .page2-head {
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            border-bottom: 1.5px solid black; padding-bottom: 8px; margin-bottom: 12px;
            font-family: Arial, sans-serif; font-size: 9pt;
        }
        .page2-school { display: flex; align-items: center; gap: 10px; }
        .page2-school img { width: 46px; height: auto; }
        .page2-learner { text-align: right; color: #444; line-height: 1.5; }
        /* Selectors below outrank the shared print reset (body:not(...) * {padding:0}). */
        @media screen {
            body { background: #EEF1F6; padding: 0 16px 40px; }
            body > .no-print {
                position: sticky; top: 0; z-index: 10; max-width: 800px; margin: 0 auto 20px;
                padding: 12px 20px; border-radius: 0 0 10px 10px; flex-wrap: wrap;
                box-shadow: 0 2px 10px rgba(15, 35, 95, .08);
            }
            body > .no-print .btn { padding: 8px 16px; }
            body > .report-wrapper { margin: 0 auto; }
            .report-wrapper > .sheet {
                max-width: 800px; margin: 0 auto 24px; padding: 32px 36px;
                box-shadow: 0 4px 20px rgba(15, 35, 95, .10); border: 1px solid #D8DEE9;
            }
        }
        @media screen and (max-width: 700px) {
            .report-wrapper > .sheet { padding: 16px; overflow-x: auto; }
            .traits-container { grid-template-columns: 1fr; }
            .sheet .meta { grid-template-columns: repeat(2, 1fr); }
            .sheet .meta > div:nth-child(2) { border-right: none; }
            .sheet .meta > div:nth-child(-n+2) { border-bottom: 1px solid #DDE3EE; }
            .sheet .signatures { grid-template-columns: 1fr; }
        }
        .page2-head, .grading-scale, .remarks-table { margin-bottom: 14px; }
        
        /* Character Grading */
        .char-grading-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 9pt;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-bottom: 15px;
        }
        .char-grading-table th {
            background-color: #023AA5;
            color: white;
            font-weight: bold;
            padding: 5px;
            border: 1px solid black;
        }
        .char-grading-table td {
            border: 1px solid black;
            padding: 5px;
        }
        
        /* Footer Info */
        .footer-info-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 9pt;
            font-family: Arial, sans-serif;
            margin-bottom: 15px;
        }
        .footer-info-table td {
            border: 1px solid black;
            padding: 6px 10px;
            width: 50%;
            text-align: center;
        }
        
        /* Signatures */
        .signatures-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 9pt;
            font-family: Arial, sans-serif;
            border: 1px solid black;
        }
        .signatures-table td {
            border: 1px solid black;
            padding: 10px;
            vertical-align: top;
        }
        .signatures-left { width: 55%; }
        .signatures-right { width: 45%; position: relative; }
        
        .stamp-container {
            position: absolute;
            bottom: -30px;
            right: 10px;
            text-align: center;
            width: 120px;
            height: 120px;
        }
        .stamp-img {
            width: 120px;
            transform: rotate(-10deg);
        }
        .stamp-date {
            position: absolute;
            top: 55px;
            left: 25px;
            font-size: 9pt;
            font-weight: bold;
            color: #023AA5;
            transform: rotate(-10deg);
            width: 80px;
            text-align: center;
        }
        
        @media print {
            body { padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
{% load static %}

{% include "academics/_report_preview_toolbar.html" %}

{% if class_reports %}{% for body in class_reports %}{{ body }}{% endfor %}{% else %}{% include "academics/_report_card_sheets.html" %}{% endif %}
</body>
</html>
