<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if class_view %}Progress Reports - {{ class_name }}{% else %}Progress Report - {{ student.get_full_name }}{% endif %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
{% include "academics/_progress_report_styles.html" %}
<style>
  /* Report card toolbar (sign-off, print, back): screen only */
  body > .no-print {
    position:sticky; top:0; z-index:10; max-width:210mm; margin:-24px auto 16px; padding:12px 16px;
    background:#fff; border:1px solid var(--border); border-top:none; border-radius:0 0 10px 10px;
    display:flex; justify-content:flex-end; align-items:center; gap:10px; flex-wrap:wrap;
    box-shadow:0 2px 10px rgba(15,35,95,.08); font-family:var(--font-ui);
  }
  .btn-green { background:#1B7B34; color:#fff; }
  .btn-green:hover { background:#156229; }
  .btn-primary:hover { background:#012A80; }
  .btn-outline:hover { background:#F3F6FC; }
  @media print { .no-print { display:none !important; } }
</style>
</head>
<body>
{% include "academics/_report_preview_toolbar.html" %}

{% if class_reports %}{% for body in class_reports %}{{ body }}{% endfor %}{% else %}{% include "academics/_progress_report_body.html" %}{% endif %}
</body>
</html>
