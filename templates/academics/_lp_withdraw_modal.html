<div id="lp-withdraw-modal" style="position:fixed; inset:0; z-index:10000; display:flex; align-items:center; justify-content:center">
  <div style="position:absolute; inset:0; background:rgba(15,23,42,0.5); backdrop-filter:blur(4px)"
       onclick="document.getElementById('lp-withdraw-modal').remove()"></div>
  <div style="position:relative; background:#fff; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.2); width:420px; max-width:95vw; padding:28px 24px">
    <div style="text-align:center; margin-bottom:20px">
      <div style="width:48px; height:48px; border-radius:12px; background:#FEF2F2; display:inline-flex; align-items:center; justify-content:center; margin-bottom:12px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
      </div>
      <h3 style="margin:0; font-size:16px; font-weight:700; color:#1E293B">Withdraw Lesson Plan?</h3>
      <p style="margin:8px 0 0; font-size:13px; color:#64748B; line-height:1.5">
        This will move <strong>{{ plan.class_name }} &mdash; {{ plan.subject_name }}</strong> back to draft.
        You can edit and resubmit it later.
      </p>
    </div>
    <div style="display:flex; gap:10px; justify-content:center">
      <button onclick="document.getElementById('lp-withdraw-modal').remove()"
              style="padding:10px 24px; border-radius:10px; border:1px solid #E2E8F0; background:#fff; font-size:13px; font-weight:600; color:#475569; cursor:pointer; transition:all 0.15s"
              onmouseover="this.style.background='#F8FAFC'" onmouseout="this.style.background='#fff'">
        Cancel
      </button>
      <button id="lp-withdraw-confirm"
              hx-post="{% url 'academics:withdraw_lesson_plan_modal' plan.pk %}"
              hx-target="#lp-withdraw-modal" hx-swap="outerHTML"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
              hx-on::before-request="this.disabled=true;this.style.opacity='0.7';this.style.cursor='wait';this.querySelector('.wd-icon').style.display='none';this.querySelector('.wd-spin').style.display='block';this.querySelector('.wd-label').textContent='Withdrawing...'"
              style="padding:10px 24px; border-radius:10px; border:none; background:#DC2626; font-size:13px; font-weight:700; color:#fff; cursor:pointer; transition:all 0.15s; display:inline-flex; align-items:center; gap:6px"
              onmouseover="this.style.background='#B91C1C'" onmouseout="this.style.background='#DC2626'">
        <svg class="wd-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
        <svg class="wd-spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="display:none;animation:btn-spin 1s linear infinite"><path d="M21 12a9 9 0 11-6.219-8.56"/></svg>
        <span class="wd-label">Withdraw</span>
      </button>
    </div>
  </div>
</div>

<style>@keyframes btn-spin { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }</style>
