{# Styles of the official Student Progress Report (progress report and report card). #}
<style>
  :root { --blue:#023AA5; --ink:#1A1A2E; --muted:#6B778C; --border:#DDE3EE;
    --crit:#B42318; --crit-bg:#FDECEA; --supp:#A15C07; --supp-bg:#FFF3E0; --pass:#1B4FD8; --pass-bg:#E9EFFD; --strong:#17803F; --strong-bg:#E5F5EB;
    --green:#1E8A4C; --green-bg:#EAF6EE; --red:#C0392B; --red-bg:#FDECEA; --amber:#C27803; --amber-bg:#FFF6E5; --purple:#5B4FCF; --purple-bg:#EFEDFB; --grey-bg:#F0F2F6;
    --font-ui:'Roboto', Arial, sans-serif; --font-display:'Merriweather', Georgia, serif; }
  @page { size:A4 portrait; margin:12mm 11mm 15mm;
    @bottom-left { content:"Hodari Christian School \00B7  Student Progress Report \00B7  Confidential"; font:8pt Roboto, Arial, sans-serif; color:#8492A6; }
    @bottom-right { content:"Page " counter(page) " of " counter(pages); font:8pt Roboto, Arial, sans-serif; color:#8492A6; }
  }
  * { box-sizing:border-box; }
  body { font-family:var(--font-ui); color:var(--ink); background:#EEF1F6; margin:0; padding:24px 16px; font-size:10pt; line-height:1.4; }
  .toolbar { max-width:210mm; margin:0 auto 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; color:#5B6578; }
  .toolbar .btns { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .toolbar select { padding:7px 10px; border-radius:7px; border:1.5px solid var(--border); font:inherit; }
  .btn { padding:8px 16px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; text-decoration:none; border:none; font-family:inherit; display:inline-block; }
  .btn-primary { background:var(--blue); color:#fff; } .btn-outline { background:#fff; color:var(--blue); border:1.5px solid var(--blue); }
  .sheet { max-width:210mm; margin:0 auto; background:#fff; padding:12mm 11mm; box-shadow:0 6px 30px rgba(15,35,95,.12); border-radius:6px; }

  .header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
  .header-left { display:flex; gap:14px; align-items:center; }
  .school-logo { width:64px; } .school-info { line-height:1.15; }
  .school-name { font-family:var(--font-display); font-weight:bold; text-transform:uppercase; margin-bottom:4px; font-size:13.5pt; }
  .school-details { font-size:8.5pt; }
  .student-photo { width:70px; height:84px; object-fit:cover; border-radius:4px; font-size:8pt; }
  .student-photo-placeholder { display:none; }
  .header-separator { border-bottom:1.5px solid #000; margin-bottom:10px; }

  .doc-title { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin:2px 0 10px; }
  .doc-title h1 { font-family:var(--font-display); font-size:16pt; color:var(--blue); margin:0; }
  .doc-title .scope { font-size:8.5pt; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--blue); background:#EAF1FD; padding:4px 10px; border-radius:20px; white-space:nowrap; }
  .meta { display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--border); border-radius:6px; margin-bottom:8px; }
  .meta div { padding:6px 10px; border-right:1px solid var(--border); border-bottom:1px solid var(--border); }
  .meta div:nth-child(4n) { border-right:none; } .meta div:nth-last-child(-n+4) { border-bottom:none; }
  .meta span { display:block; font-size:7pt; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .meta b { font-size:9.5pt; font-weight:600; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:8px; }
  .kpi { border:1px solid var(--border); border-radius:6px; padding:6px 9px; }
  .kpi span { display:block; font-size:6.8pt; letter-spacing:.7px; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .kpi b { display:block; font-size:15pt; line-height:1.15; margin-top:3px; font-family:'Roboto Mono', Consolas, monospace; }
  .kpi small { font-size:7.5pt; color:var(--muted); }

  h2 { font-size:11pt; color:var(--blue); margin:8px 0 4px; padding-bottom:4px; border-bottom:2px solid var(--blue); break-after:avoid; page-break-after:avoid; }
  h2 small { font-weight:400; color:var(--muted); font-size:8.5pt; margin-left:6px; }
  table.t { width:100%; border-collapse:collapse; font-size:8.8pt; }
  table.t th { background:var(--blue); color:#fff; text-align:left; font-size:7.3pt; letter-spacing:.5px; text-transform:uppercase; padding:5px 6px; border:1px solid var(--blue); }
  table.t td { padding:3px 6px; border:1px solid #DDE3EE; vertical-align:middle; }
  table.t tbody tr:nth-child(even) td { background:#F7F9FC; }
  table.t thead { display:table-header-group; }
  table.t tr { break-inside:avoid; page-break-inside:avoid; }
  table.t tfoot td { font-weight:700; background:#F0F3F8; border-top:2px solid #3C4559; }
  .r { text-align:right; } .ctr { text-align:center; } .mono { font-family:'Roboto Mono', Consolas, monospace; white-space:nowrap; }
  .na { color:#B4BBC9; }
  .b-critical { color:var(--crit); font-weight:700; } .b-support { color:var(--supp); font-weight:700; }
  .b-pass { color:var(--pass); font-weight:700; } .b-strong { color:var(--strong); font-weight:700; }
  .b-green { color:var(--green); font-weight:700; } .b-amber { color:var(--amber); font-weight:700; } .b-red { color:var(--red); font-weight:700; } .b-none { color:#9AA0AE; }
  .st { display:inline-block; padding:1px 7px; border-radius:10px; font-size:7.6pt; font-weight:700; white-space:nowrap; }
  .st.critical { background:var(--crit-bg); color:var(--crit); } .st.support { background:var(--supp-bg); color:var(--supp); }
  .st.pass, .st.strong { background:var(--strong-bg); color:var(--strong); }
  .g { display:inline-block; min-width:22px; text-align:center; font-weight:700; }
  .up { color:var(--strong); } .down { color:var(--crit); }
  .two { display:grid; grid-template-columns:1.1fr .9fr; gap:14px; align-items:start; }
  .days { display:flex; flex-wrap:wrap; gap:3px; margin-top:6px; }
  .days i { display:block; width:11px; height:16px; border-radius:2px; background:#E2E8F0; }
  .days .d-P { background:#2FA866; } .days .d-L { background:#E39A3B; } .days .d-A { background:#C8302A; } .days .d-E { background:#7E73E0; }
  .student-photo { width:62px; height:74px; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; font-size:7.5pt; color:var(--muted); margin-top:5px; }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:3px; vertical-align:-1px; }
  .comments { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .comment { border:1px solid var(--border); border-radius:6px; min-height:40px; padding:6px 10px; font-size:8.5pt; color:var(--muted); break-inside:avoid; }
  .comment b { display:block; color:var(--ink); font-size:8.5pt; margin-bottom:2px; }
  .notes { margin-top:10px; font-size:7.6pt; color:#5B6578; border:1px solid var(--border); border-radius:6px; padding:8px 10px; break-inside:avoid; page-break-inside:avoid; }
  .notes ul { margin:4px 0 0 16px; padding:0; } .notes li { margin:1px 0; }
  .st.await { background:#FFF4DA; color:#8A6400; }
  .await-cell { background:#FFF4DA !important; color:#8A6400; text-align:center; }
  .awaiting-note { background:#FFF4DA; border:1px solid #F0DFB4; color:#8A6400; border-radius:6px; padding:6px 10px; font-size:8.5pt; margin-bottom:8px; }
  .empty { padding:12px; border:1px dashed var(--border); border-radius:6px; color:var(--muted); font-size:9pt; text-align:center; }
  .signatures { display:grid; grid-template-columns:1fr 1fr 1fr; gap:28px; margin-top:8px; padding-top:4px; border-top:1px solid var(--border); break-inside:avoid; page-break-inside:avoid; align-items:start; }
  .sig-line { border-bottom:1.5px solid #474747; height:30px; }
  .sig-label { font-size:9pt; font-weight:700; color:#474747; margin-top:6px; line-height:1.3; }
  .sig-label span { font-weight:400; }

  @media print {
    body { background:#fff; padding:0; }
    .toolbar { display:none !important; }
    .sheet { box-shadow:none; border-radius:0; padding:0; max-width:none; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
  @media screen and (max-width:700px) {
    .comments { grid-template-columns:1fr; }
    .sheet { padding:16px; } .meta { grid-template-columns:repeat(2,1fr); } .kpis { grid-template-columns:repeat(2,1fr); }
    .meta div:nth-child(4n) { border-right:1px solid var(--border); } .meta div:nth-child(2n) { border-right:none; } .meta div:nth-child(-n+2) { border-bottom:1px solid var(--border); }
    .two, .signatures { grid-template-columns:1fr; }
    .scroll { overflow-x:auto; }
  }

  /* Official report card additions: grading scale, page 2, general traits, stamp */
  table.ap tfoot td:not(:first-child) { text-align:center; font-family:'Roboto Mono', Consolas, monospace; }
  table.ap td.await-cell { font-family:inherit; }
  .report-wrapper + .report-wrapper { margin-top:24px; }
  .sheet-2 { margin-top:24px; }
  .scale { width:100%; border-collapse:collapse; font-size:7.8pt; text-align:center; margin-top:6px; }
  .scale th { background:var(--blue); color:#fff; padding:4px; border:1px solid var(--blue); letter-spacing:.5px; text-transform:uppercase; font-size:7.3pt; }
  .scale td { border:1px solid var(--border); padding:3px 4px; }
  .scale tr.bold td { font-weight:700; }
  .page2-head { display:flex; justify-content:space-between; align-items:center; gap:12px; border-bottom:1.5px solid #000; padding-bottom:8px; margin-bottom:10px; font-size:8.8pt; }
  .page2-school { display:flex; align-items:center; gap:10px; }
  .page2-school img { width:44px; height:auto; }
  .page2-learner { text-align:right; color:#444; line-height:1.5; }
  .traits-container { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; align-items:start; }
  .traits-full { grid-column:1 / -1; }
  .traits-table { width:100%; border-collapse:collapse; font-size:8.6pt; }
  .traits-table th { background:var(--blue); color:#fff; text-align:center; padding:4px; border:1px solid var(--blue); font-size:7.6pt; letter-spacing:.5px; text-transform:uppercase; }
  .traits-table td { border:1px solid var(--border); padding:3px 6px; text-align:left; }
  .traits-table td.g { display:table-cell; min-width:0; text-align:center; width:26px; font-weight:700; }
  .info-row { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--border); border-radius:6px; margin:8px 0; font-size:9pt; }
  .info-row > div { padding:6px 10px; } .info-row > div + div { border-left:1px solid var(--border); }
  .info-row small { display:block; font-size:7.6pt; color:var(--muted); }
  .comment.filled { color:var(--ink); white-space:pre-wrap; }
  .comment + .comment { margin-top:8px; }
  .sig-hos { position:relative; }
  .stamp-container { position:absolute; top:-46px; right:0; width:110px; height:110px; text-align:center; }
  .stamp-img { width:110px; transform:rotate(-10deg); }
  .stamp-date { position:absolute; top:50px; left:20px; width:76px; font-size:8.5pt; font-weight:700; color:var(--blue); transform:rotate(-10deg); }
  @media print {
    .report-wrapper + .report-wrapper, .sheet-2 { margin-top:0; break-before:page; page-break-before:always; }
  }
  @media screen and (max-width:700px) {
    .traits-container, .info-row { grid-template-columns:1fr; }
    .info-row > div + div { border-left:none; border-top:1px solid var(--border); }
  }
</style>
