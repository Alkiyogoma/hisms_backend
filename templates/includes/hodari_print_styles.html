<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Merriweather:wght@700&display=swap');
  :root {
    --hodari-blue: #023AA5;
    --hodari-gold: #FBBC05;
    --hodari-charcoal: #474747;
    --text-primary: #1A1A2E;
    --text-muted: #8492A6;
    --border: #DDE3EE;
    --font-ui: 'Roboto', sans-serif;
    --font-display: 'Merriweather', serif;
  }
  /* Standalone print documents only. When this include is used inside the app
     shell (which has a .sidebar), these body-level styles must NOT apply — they
     would inset the whole layout (topbar/sidebar) and reset app spacing. The
     :not(:has(.sidebar)) guard keeps them scoped to standalone print pages. */
  body:not(:has(.sidebar)) { font-family: var(--font-ui); background: #F2F5FA; color: var(--text-primary); line-height: 1.5; padding: 20px; }
  body:not(:has(.sidebar)) *, body:not(:has(.sidebar)) *::before, body:not(:has(.sidebar)) *::after { box-sizing: border-box; margin: 0; padding: 0; }
  .no-print { max-width: 720px; margin: 0 auto 16px; display: flex; justify-content: flex-end; gap: 10px; }
  .btn { padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; border: none; }
  .btn-primary { background: var(--hodari-blue); color: #fff; }
  .btn-outline { background: #fff; color: var(--hodari-blue); border: 1.5px solid var(--hodari-blue); }
  .doc-container { max-width: 720px; margin: 0 auto; background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border-radius: 12px; overflow: hidden; }
  .print-only { display: none !important; }

  /* ── Standard Print Header (matches PTC / Report form format) ── */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
    padding: 0;
  }
  .header-left {
    display: flex;
    gap: 15px;
    align-items: flex-start;
  }
  .school-logo {
    width: 90px;
    height: auto;
    flex-shrink: 0;
  }
  .school-info {
    text-align: left;
    line-height: 1.1;
  }
  .school-name {
    font-family: var(--font-display);
    font-size: 16pt;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .school-details {
    font-size: 11pt;
    font-family: var(--font-ui);
    color: var(--text-primary);
  }
  .student-photo {
    width: 100px;
    height: 120px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .header-separator {
    border-bottom: 1.5px solid black;
    margin-bottom: 15px;
  }

  /* ── Blue Gradient Doc Header (finance-style) ── */
  .doc-header { background: linear-gradient(135deg, #023AA5 0%, #1A56C4 100%); color: #fff; padding: 24px 28px; }
  .doc-header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .doc-logo { height: 44px; width: auto; flex-shrink: 0; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.15)); }
  .school-tagline { font-size: 11px; opacity: 0.75; font-style: italic; margin-top: 2px; }
  .doc-meta { text-align: right; font-size: 12px; opacity: 0.85; }
  .doc-badge { display: inline-block; margin-top: 10px; background: rgba(251,188,5,.2); border: 1px solid rgba(251,188,5,.45); color: #FBBC05; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 6px; letter-spacing: 0.04em; }

  /* ── Shared Document Body / Tables / Signatures ── */
  .doc-body { padding: 24px 28px; }
  .doc-table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 16px 0; }
  .doc-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); padding: 8px 0; border-bottom: 2px solid var(--border); }
  .doc-table td { padding: 10px 0; border-bottom: 1px solid #F0F4FB; }
  .doc-table .num { text-align: right; font-weight: 600; }
  .doc-total { display: flex; justify-content: space-between; font-size: 16px; font-weight: 800; padding: 16px 0 0; border-top: 2px solid var(--border); margin-top: 8px; color: var(--hodari-blue); }
  .doc-footer { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-muted); }
  .signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: end; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--border); page-break-inside: avoid; }
  .sig-line { border-bottom: 1.5px solid var(--hodari-charcoal); height: 40px; min-height: 40px; position: relative; }
  .sig-label { font-size: 12px; font-weight: 600; color: var(--hodari-charcoal); margin-top: 8px; line-height: 1.3; }

  /* ── Standard Print Button ── */
  .print-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 7px; font-size: 12px; font-weight: 600;
    background: #fff; color: var(--hodari-blue); border: 1.5px solid var(--hodari-blue);
    cursor: pointer; transition: all 0.2s;
  }
  .print-btn:hover { background: var(--hodari-blue); color: #fff; }
  .print-btn svg { width: 14px; height: 14px; }

  @media print {
    body { background: #fff; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .no-print, .print-hide, .no-print-area { display: none !important; }
    .print-only { display: block !important; }
    .doc-container { box-shadow: none; border-radius: 0; max-width: 100%; }
    .header { border-radius: 0 !important; }
    table { width: 100% !important; border-collapse: collapse !important; }
    th, td { padding: 6px 8px !important; border: 1px solid #ddd !important; }
    th { background: #f0f0f0 !important; font-weight: 700 !important; text-transform: uppercase !important; font-size: 9px !important; letter-spacing: 0.05em !important; }
    tr { page-break-inside: avoid !important; }
  }
</style>
