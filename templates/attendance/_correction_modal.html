<div id="correction-modal-{{ entry.id }}" class="modal-overlay" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:16px;max-width:440px;width:92%;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative">
    <button type="button" onclick="this.closest('.modal-overlay').style.display='none'" style="position:absolute;top:14px;right:16px;border:none;background:none;cursor:pointer;font-size:20px;color:var(--text-muted);line-height:1">&times;</button>

    <h3 style="font-size:16px;font-weight:700;color:var(--text-primary);margin:0 0 4px">Correct Attendance</h3>
    <p style="font-size:13px;color:var(--text-secondary);margin:0 0 18px">
      {{ entry.student.get_full_name }} &middot; {{ entry.date|date:"d M Y" }}
      <br><span style="font-size:11px;color:var(--text-muted)">Current status: <strong>{{ entry.get_status_display }}</strong></span>
    </p>

    <form method="post" action="{% url 'attendance:correct' %}">
      {% csrf_token %}
      <input type="hidden" name="entry_id" value="{{ entry.id }}">

      <div style="margin-bottom:14px">
        <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:4px">New Status</label>
        <select name="status" required style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff">
          {% for val, label in statuses %}
          <option value="{{ val }}" {% if entry.status == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div style="margin-bottom:18px">
        <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:4px">Reason for Correction *</label>
        <textarea name="reason" rows="3" required
                  style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;resize:vertical"
                  placeholder="Required. This will be logged in the audit trail."></textarea>
      </div>

      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button type="button" onclick="this.closest('.modal-overlay').style.display='none'"
                style="padding:8px 16px;border-radius:7px;font-size:13px;font-weight:600;background:#fff;color:var(--text-secondary);border:1px solid var(--border);cursor:pointer">Cancel</button>
        <button type="submit"
                style="padding:8px 16px;border-radius:7px;font-size:13px;font-weight:600;background:#92400E;color:#fff;border:none;cursor:pointer">Save Correction</button>
      </div>
    </form>

    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted)">
      <svg style="width:12px;height:12px;vertical-align:middle;margin-right:4px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 9v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      Correction requires a reason. Both original and corrected entries are permanently retained in the audit trail.
    </div>
  </div>
</div>
