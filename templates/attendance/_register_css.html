<style>
  .rs { --rs-ink:#1F2430; --rs-muted:#6B7385; --rs-line:#DDE2EB; color:var(--rs-ink); }
  .rs-head { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; border-bottom:2px solid #023AA5; padding-bottom:10px; margin-bottom:12px; }
  .rs-head h3 { margin:0; font-size:15px; letter-spacing:.3px; text-transform:uppercase; }
  .rs-head .m { font-size:12px; color:#4A5266; line-height:1.7; margin-top:4px; }
  .rs-head .r { font-size:11.5px; color:var(--rs-muted); text-align:right; line-height:1.7; }

  .rs table { border-collapse:collapse; width:100%; }

  .rs th.nm, .rs td.nm { text-align:left; padding-left:6px; min-width:150px; }

  .rs .c-P { background:#EAF6EE; color:#1E8A4C; } .rs .c-A { background:#FDECEA; color:#C0392B; }
  .rs .c-L { background:#FFF6E5; color:#C27803; } .rs .c-E { background:#EFEDFB; color:#5B4FCF; }
  .rs .c-U { background:#F0F2F6; color:#AEB4C0; }
