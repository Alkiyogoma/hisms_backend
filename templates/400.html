<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>400 — Bad Request | {{ brand.school_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'branding/hodari.css' %}">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg, #F8F9FC); font-family: 'Inter', sans-serif; margin: 0; }
    .error-wrap { text-align: center; max-width: 480px; padding: 40px 24px; }
    .error-code { font-size: 96px; font-weight: 700; color: #64748B; line-height: 1; letter-spacing: -4px; margin: 0; }
    .error-badge { display: inline-block; margin: 16px 0 8px; padding: 4px 14px; background: #F1F5F9; color: #475569; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .05em; }
    .error-title { font-size: 22px; font-weight: 700; color: var(--text, #1E293B); margin: 0 0 8px; }
    .error-desc { font-size: 14px; color: var(--text-muted, #64748B); margin: 0 0 28px; line-height: 1.6; }
    .error-logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 36px; }
    .error-logo img { height: 38px; }
    .error-logo-text { font-size: 15px; font-weight: 700; color: var(--primary, #4F46E5); letter-spacing: .04em; }
    .btn-home { display: inline-flex; align-items: center; gap: 8px; background: var(--primary, #4F46E5); color: #fff; padding: 10px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; text-decoration: none; transition: opacity .15s; }
    .btn-home:hover { opacity: .88; }
    .btn-back { display: inline-flex; align-items: center; gap: 8px; background: transparent; color: var(--text-muted, #64748B); padding: 10px 20px; border-radius: 12px; font-size: 14px; font-weight: 500; text-decoration: none; border: 1px solid var(--border, #E2E8F0); margin-left: 8px; transition: background .15s; }
    .btn-back:hover { background: var(--border, #E2E8F0); }
    .divider { border: none; border-top: 1px solid var(--border, #E2E8F0); margin: 32px 0; }
    .tagline { font-size: 12px; color: var(--text-muted, #94A3B8); font-style: italic; }
  </style>
</head>
<body>
  <div class="error-wrap">
    <div class="error-logo">
      <img src="{% static 'branding/favicon.ico' %}" alt="{{ brand.school_name }}">
      <span class="error-logo-text">{{ brand.school_name }}</span>
    </div>

    <div class="error-code">400</div>
    <div class="error-badge">BAD REQUEST</div>
    <h1 class="error-title">We couldn't understand that request</h1>
    <p class="error-desc">
      The request sent to the server was malformed or contained invalid data.<br>
      Please try again or return to the dashboard.
    </p>

    <div>
      <a href="/" class="btn-home">
        <svg width="14" height="14" viewBox="0 0 17 17" fill="none"><path d="M2 8.5L8.5 2 15 8.5M3.5 7V15h4V11h2v4h4V7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        Go to Dashboard
      </a>
      <a href="javascript:history.back()" class="btn-back">Go Back</a>
    </div>

    <hr class="divider">
    <p class="tagline">"The courage to stand out" — {{ brand.school_name }}</p>
  </div>
</body>
</html>
