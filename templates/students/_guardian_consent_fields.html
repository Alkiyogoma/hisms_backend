{# Optional PDPA consent (method and version are recorded with it, FR-PAR-004); portal access only for a new parent. #}
<input type="hidden" name="pdpa_consent_shown" value="1">
<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px; margin-top:16px">
  <div style="padding:14px; background:#FEF3C7; border:{% if errors.pdpa %}1.5px solid #DC2626{% else %}1px solid #FCD34D{% endif %}; border-radius:8px">
    <label style="display:flex; align-items:flex-start; gap:8px; font-size:13px; cursor:pointer">
      <input type="checkbox" name="pdpa_consent_given" id="pdpa"{% if values.pdpa_consent_given %} checked{% endif %}{% if errors.pdpa %} aria-invalid="true" aria-describedby="pdpa_error"{% endif %} style="width:18px; height:18px; accent-color:var(--green); margin-top:1px">
      <span><strong>PDPA Consent</strong> <span style="color:#8492A6; font-weight:400">(optional)</span>  parent has acknowledged and signed the PDPA Consent Form{% if edit_mode %}. Untick to withdraw consent.{% endif %}</span>
    </label>
    <div style="display:flex; gap:16px; margin-top:8px; margin-left:26px">
      <label style="display:flex; align-items:center; gap:6px; font-size:12px; cursor:pointer">
        <input type="radio" name="pdpa_consent_method" value="in_person"{% if values.pdpa_consent_method == "in_person" %} checked{% endif %} style="accent-color:var(--green)">
        In-person
      </label>
      <label style="display:flex; align-items:center; gap:6px; font-size:12px; cursor:pointer">
        <input type="radio" name="pdpa_consent_method" value="digital"{% if values.pdpa_consent_method == "digital" %} checked{% endif %} style="accent-color:var(--green)">
        Digital
      </label>
    </div>
    <div style="margin-top:8px; margin-left:26px; display:flex; align-items:center; gap:8px; font-size:12px">
      <label for="pdpa_version">Consent statement version</label>
      <input type="text" name="pdpa_consent_version" id="pdpa_version" maxlength="32" placeholder="e.g. v1.0" value="{{ values.pdpa_consent_version|default:'' }}" style="flex:1; padding:6px 8px; border:1px solid var(--border); border-radius:6px">
    </div>
    {% if errors.pdpa %}<p class="hf2-error" id="pdpa_error" style="margin:8px 0 0 26px">{{ errors.pdpa }}</p>{% endif %}
  </div>
  {% if not edit_mode %}
  <div style="padding:14px; background:#EEF4FF; border:1px solid #B6C9F5; border-radius:8px">
    <label style="display:flex; align-items:flex-start; gap:8px; font-size:13px; cursor:pointer">
      <input type="checkbox" name="portal_access" id="portal_access"{% if values.portal_access %} checked{% endif %} style="width:18px; height:18px; accent-color:var(--green); margin-top:1px">
      <span><strong>Portal Access</strong>  create a login account so this parent can view attendance, report cards, invoices and school communications online.</span>
    </label>
  </div>
  {% endif %}
</div>
