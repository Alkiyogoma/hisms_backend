{% extends "base.html" %}
{% load static %}

{% block title %}Edit Profile - Parent Portal{% endblock %}

{% block content %}
<div class="page-hdr">
  <h1>Edit Profile</h1>
  <p>Update your personal details</p>
</div>

<div class="card" style="padding:24px;max-width:600px">
  <form method="POST">
    {% csrf_token %}

    <div style="margin-bottom:16px">
      <label style="display:block;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">First Name</label>
      <input type="text" name="first_name" value="{{ profile_user.first_name }}" required
             style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px">
    </div>

    <div style="margin-bottom:16px">
      <label style="display:block;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">Last Name</label>
      <input type="text" name="last_name" value="{{ profile_user.last_name }}" required
             style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px">
    </div>

    <div style="margin-bottom:16px">
      <label style="display:block;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">Phone Number</label>
      <input type="tel" name="phone_number" value="{{ guardian.phone|default:'' }}"
             style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px">
    </div>

    <div style="margin-bottom:16px">
      <label style="display:block;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">Backup Phone Number</label>
      <input type="tel" name="secondary_phone" value="{{ guardian.secondary_phone|default:'' }}"
             style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px">
    </div>

    <div style="margin-bottom:16px">
      <label style="display:block;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">Email</label>
      <input type="email" name="email" value="{{ profile_user.email|default:'' }}"
             style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px">
    </div>

    <div style="margin-bottom:20px">
      <label style="display:block;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px">Address</label>
      <textarea name="address" rows="3"
                style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px">{{ guardian.address|default:'' }}</textarea>
    </div>

    <div style="display:flex;gap:10px">
      <button type="submit" style="padding:10px 24px;background:var(--hodari-blue);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">Save Changes</button>
      <a href="{% url 'users:profile' %}" style="padding:10px 20px;background:#fff;color:var(--text-muted);border:1px solid var(--border);border-radius:8px;font-size:14px;text-decoration:none">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
